name: Sync APK to itch.io
on:
 release:
  types:
   - published
 reaction:
  types:
   - created
   - deleted
env:
 GH_TOKEN: ${{ github.token }}
 RELEASE_ID: ${{ github.event.release.id || github.event.issue.number }}
 ACTION: ${{ github.event.action }}
jobs:
 cache-butler:
   runs-on: ubuntu-latest
   steps:
    - name: cache butler binary
     uses: actions/cache@v4
     with:
      path: ~/.butler/bin
      key: butler-${{ runner.os }}
 install-jq:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: install jq
    run: sudo apt-get update && sudo apt-get install -y jq
 setup:
  needs: install-jq
  runs-on: ubuntu-latest
  outputs:
   ready: "true"
  steps:
   - uses: actions/checkout@v4
   - name: Make scripts executable
    run: chmod +x .github/scripts/*.sh
 preflight:
  needs: setup
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Run preflight validation
    run: .github/scripts/preflight-check.sh
     env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
 preflight-failure-report:
  needs: preflight
  if: failure()
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Report preflight error to dashboard
    run: .github/scripts/report-preflight-error.sh
 resolve-release-version:
  needs: preflight
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Resolve release version
    run: .github/scripts/resolve-release-version.sh
 sync-apk:
  needs: resolve-release-version
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Upload APK to itch.io
    run: .github/scripts/sync-itch-apk.sh
     env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
 update-dashboard:
  needs: sync-apk
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Update Release dashboard
    run: .github/scripts/update-release-dashboard.sh