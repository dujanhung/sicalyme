name: Sync APK to itch.io
on:
 release:
  types:
   - published
env:
 GH_TOKEN: ${{ github.token }}
 RELEASE_ID: ${{ github.event.release.id || github.event.issue.number }}
 ACTION: ${{ github.event.action }}
jobs:
 cache-butler:
  runs-on: ubuntu-latest
  steps:
   - name: cache butler binary
     uses: actions/cache@v4
     env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
     with:
      path: ~/.butler/bin
      key: butler-${{ runner.os }}
 install-jq:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: install jq
     run: sudo apt-get update && sudo apt-get install -y jq
 setup:
  needs: install-jq
  runs-on: ubuntu-latest
  outputs:
   ready: "true"
  steps:
   - uses: actions/checkout@v4
   - name: Make scripts executable
     run: chmod +x .github/scripts/*.sh
 do-test-sh:
  needs: setup
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: test
     run: .github/scripts/test.sh
 resolve-release-version:
  needs: do-test-sh
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Resolve release version
     run: .github/scripts/resolve-release-version.sh
 sync-apk:
  needs: resolve-release-version
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Upload APK to itch.io
     env:
      BUTLER_API_KEY: ${{ secrets.ITCH_IO_SICALYME }}
     run: .github/scripts/sync-itch-apk.sh