name: Ensure SVG Transform to d

on:
  push:
    # Trigger only when SVG files are changed in a push
    paths:
      - '**/*.svg'

jobs:
  mixdown-svg:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set Up Node.js (Or Python, Choose Your Tool)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use an appropriate version 

      # Step 3: Install a Tool for SVG Transformation
      - name: Install SVGO for Processing SVG
        run: npm install -g svgo

      # Step 4: Add a Script to Process SVGs
      - name: Normalize SVG Transformations
        run: |
          npx svgo --multipass --config "{ plugins: [{ name: 'convertPathData', params: { applyTransforms: true } }] }" resource/svg/*.svg

      # Step 5: Commit Automatically if Changes are Found
      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to SVG files."
          else
            git commit -m "Normalized SVG transform to path (d)"
            git push