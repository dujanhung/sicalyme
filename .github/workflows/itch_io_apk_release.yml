name: Sync APK Release to itch.io

on:
 release:
  types: [published]

 reaction:
  types: [created]

jobs:
 upload:

  if: >
   github.event_name == 'release' ||
   (
    github.event_name == 'reaction' &&
    github.event.reaction.content == 'eyes' &&
    github.event.repository.owner.login == github.event.sender.login &&
    github.event.subject_type == 'release'
   )

  runs-on: ubuntu-latest

  env:
   USERNAME: "dujanhung"
   GAMENAME: "sicalyme"

  steps:

   - name: Detect Release ID + tag
    id: release_info
    run: |
     if [ "${{ github.event_name }}" = "release" ]; then
      echo "id=${{ github.event.release.id }}" >> $GITHUB_OUTPUT
      echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
     else
      echo "id=${{ github.event.subject_id }}" >> $GITHUB_OUTPUT
      echo "tag=${{ github.event.release.tag_name || github.ref_name }}" >> $GITHUB_OUTPUT
     fi

   - name: Download APK files
    uses: robinraju/release-downloader@v1
    with:
     releaseId: ${{ steps.release_info.outputs.id }}
     fileName: "*.apk"
     out-file-path: build

   - name: Detect release stage
    id: stage
    run: |
     TAG="${{ steps.release_info.outputs.tag }}"

     if [[ "$TAG" == *nightly* ]]; then
      echo "stage=nightly" >> $GITHUB_OUTPUT
     elif [[ "$TAG" == *beta* ]]; then
      echo "stage=beta" >> $GITHUB_OUTPUT
     else
      echo "stage=stable" >> $GITHUB_OUTPUT
     fi

   - name: Check if APK exists
    id: check_apk
    run: |
     if ls build/*.apk 1> /dev/null 2>&1; then
      echo "apk_found=true" >> $GITHUB_OUTPUT
     else
      echo "apk_found=false" >> $GITHUB_OUTPUT
     fi

   - name: Install butler
    if: steps.check_apk.outputs.apk_found == 'true'
    uses: remarkablegames/setup-butler@v2

   - name: Upload with promotion logic
    if: steps.check_apk.outputs.apk_found == 'true'
    run: |

     VERSION="${{ steps.release_info.outputs.tag }}"
     STAGE="${{ steps.stage.outputs.stage }}"

     for file in build/*.apk; do

      NAME=$(basename "$file" .apk)

      if [[ "$NAME" == *arm64* ]]; then
       VARIANT="arm64"
      elif [[ "$NAME" == *universal* ]]; then
       VARIANT="universal"
      elif [[ "$NAME" == *x86* ]]; then
       VARIANT="x86"
      else
       VARIANT=""
      fi

      upload_channel () {

       BASE="$1"

       if [ -z "$VARIANT" ]; then
        CHANNEL="$BASE"
       else
        CHANNEL="$BASE-$VARIANT"
       fi

       echo "Uploading → $CHANNEL"

       butler push "$file" $USERNAME/$GAMENAME:$CHANNEL \
        --userversion "$VERSION"
      }

      if [ "$STAGE" = "nightly" ]; then
       upload_channel android-nightly

      elif [ "$STAGE" = "beta" ]; then
       upload_channel android-beta

      else
       upload_channel android
       upload_channel android-beta
       upload_channel android-nightly
      fi

     done

    env:
     BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

   - name: Skip message (no APK attached)
    if: steps.check_apk.outputs.apk_found == 'false'
    run: echo "No APK found in release assets. Skipping itch.io upload."