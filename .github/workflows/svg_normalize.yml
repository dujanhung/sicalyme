name: Normalize SVG Transform

on:
  push:
    paths:
      - '**.svg'
  pull_request:
    paths:
      - '**.svg'

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile SVG transformer
        run: |
          g++ tools/svg_transformer.cpp -o svg_transformer

      - name: Run transformer on SVG files
        run: |
          find . -name "*.svg" -print0 | while IFS= read -r -d '' file; do
            ./svg_transformer "$file"
          done

      - name: Commit changes if needed
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .
            git commit -m "Auto-normalize SVG transform → d"
            git push
          fi