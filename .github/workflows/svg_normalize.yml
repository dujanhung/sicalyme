name: normalize SVG transform

on:
  push:
    paths:
      - '**.svg'
  pull_request:
    paths:
      - '**.svg'

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: install tools
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential

      - name: install libtinyxml2-dev
        run: |
          sudo apt install libtinyxml2-dev

      - name: compile script
        run: |
          g++ tools/svg_transformer.cpp -o svg_transformer

      - name: run script
        run: |
          find . -name "*.svg" -print0 | while IFS= read -r -d '' file; do
            ./svg_transformer "$file"
          done

      - name: commit changes if needed
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .
            git commit -m "Auto-normalize SVG transform → d"
            git push
          fi